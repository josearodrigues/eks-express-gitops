apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-express-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/josearodrigues/eks-express-gitops.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
