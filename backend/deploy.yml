apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 381491977261.dkr.ecr.us-east-1.amazonaws.com/eks-express/production/backend:latest
        ports:
        - containerPort: 80
